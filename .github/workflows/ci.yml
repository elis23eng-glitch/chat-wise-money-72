name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Checagem diária da versão publicada (marca d'água).
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  validar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Verificação de tipos
        run: bun run typecheck

      - name: Testes unitários
        run: bun run test

      - name: Build de produção
        id: build
        run: |
          inicio=$(date +%s)
          bun run build | tee /tmp/build.log
          echo "duracao=$(( $(date +%s) - inicio ))" >> "$GITHUB_OUTPUT"
        env:
          # Valores fictícios apenas para validar a compilação no CI.
          # Nenhum dado real é acessado durante o build.
          VITE_SUPABASE_URL: https://exemplo-ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: chave-ficticia-somente-para-ci
          VITE_SUPABASE_PROJECT_ID: projeto-ficticio-ci

      - name: Resumo do build
        if: always()
        run: |
          {
            echo "## Resumo do build"
            echo ""
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Status do build | ${{ steps.build.outcome }} |"
            echo "| Duração do build | ${{ steps.build.outputs.duracao || 'n/d' }}s |"
            echo "| Tamanho de \`.output\` | $(du -sh .output 2>/dev/null | cut -f1 || echo 'n/d') |"
            echo "| Arquivos JS gerados | $(find .output -name '*.js' 2>/dev/null | wc -l) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  marca-dagua:
    name: Validação visual (marca d'água)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Conferir marca d'água no app publicado
        id: verificacao
        run: bun scripts/verificar-marca-dagua.mjs | tee /tmp/marca-dagua.txt
        env:
          APP_URL: https://chat-wise-money-72.lovable.app

      - name: Preparar detalhes do alerta
        if: failure() && steps.verificacao.outcome == 'failure'
        id: alerta
        run: |
          BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "build_url=${BUILD_URL}" >> "$GITHUB_OUTPUT"
          {
            echo "detalhes<<EOF"
            cat /tmp/marca-dagua.txt 2>/dev/null || echo "Sem detalhes."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Alertar por webhook
        if: failure() && steps.alerta.outcome == 'success' && env.ALERTA_WEBHOOK_URL != ''
        env:
          ALERTA_WEBHOOK_URL: ${{ secrets.ALERTA_WEBHOOK_URL }}
        run: |
          jq -n \
            --arg titulo "Marca d'água do Lovable detectada no Wise Money" \
            --arg build "${{ steps.alerta.outputs.build_url }}" \
            --arg commit "${GITHUB_SHA}" \
            --arg detalhes "${{ steps.alerta.outputs.detalhes }}" \
            '{text: ($titulo + "\n" + $build + "\n\n" + $detalhes), titulo: $titulo, build_url: $build, commit: $commit, detalhes: $detalhes}' \
            > /tmp/alerta.json
          curl -sS -X POST -H 'content-type: application/json' \
            --data @/tmp/alerta.json "$ALERTA_WEBHOOK_URL"

      - name: Alertar por e-mail
        if: failure() && steps.alerta.outcome == 'success' && env.SMTP_SERVIDOR != ''
        env:
          SMTP_SERVIDOR: ${{ secrets.SMTP_SERVIDOR }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVIDOR }}
          server_port: ${{ secrets.SMTP_PORTA }}
          username: ${{ secrets.SMTP_USUARIO }}
          password: ${{ secrets.SMTP_SENHA }}
          subject: "[Wise Money] Marca d'água do Lovable reapareceu"
          to: ${{ secrets.ALERTA_EMAIL_PARA }}
          from: Wise Money CI <${{ secrets.SMTP_USUARIO }}>
          body: |
            A validação visual detectou a marca d'água no app publicado.

            Build que falhou: ${{ steps.alerta.outputs.build_url }}
            Commit: ${{ github.sha }}

            ${{ steps.alerta.outputs.detalhes }}

      - name: Abrir issue de rastreio
        if: failure() && steps.alerta.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Marca d'água do Lovable reapareceu ($(date -u +%Y-%m-%d))" \
            --body "$(printf 'Build que falhou: %s\nCommit: %s\n\n%s\n' \
              "${{ steps.alerta.outputs.build_url }}" "${GITHUB_SHA}" \
              "${{ steps.alerta.outputs.detalhes }}")" \
            || echo "Não foi possível abrir a issue (permissões de escrita desativadas)."

    permissions:
      contents: read
      issues: write

  regressao-visual:
    name: Regressão visual (screenshots por rota)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Instalar navegador do Playwright
        run: bunx playwright install --with-deps chromium

      - name: Capturar e comparar screenshots
        id: visual
        run: bun scripts/regressao-visual.mjs | tee /tmp/regressao-visual.txt
        env:
          APP_URL: https://chat-wise-money-72.lovable.app
          LIMITE_DIFF_PCT: "0.5"

      - name: Publicar screenshots e diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regressao-visual
          path: |
            tests/visual/atual
            tests/visual/diff
          if-no-files-found: ignore
          retention-days: 14

      - name: Preparar detalhes do alerta
        if: failure() && steps.visual.outcome == 'failure'
        id: alerta
        run: |
          echo "build_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          {
            echo "detalhes<<EOF"
            cat /tmp/regressao-visual.txt 2>/dev/null || echo "Sem detalhes."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Alertar por webhook
        if: failure() && steps.alerta.outcome == 'success' && env.ALERTA_WEBHOOK_URL != ''
        env:
          ALERTA_WEBHOOK_URL: ${{ secrets.ALERTA_WEBHOOK_URL }}
        run: |
          jq -n \
            --arg titulo "Regressão visual detectada no Wise Money" \
            --arg build "${{ steps.alerta.outputs.build_url }}" \
            --arg commit "${GITHUB_SHA}" \
            --arg detalhes "${{ steps.alerta.outputs.detalhes }}" \
            '{text: ($titulo + "\n" + $build + "\n\n" + $detalhes), titulo: $titulo, build_url: $build, commit: $commit, detalhes: $detalhes}' \
            > /tmp/alerta-visual.json
          curl -sS -X POST -H 'content-type: application/json' \
            --data @/tmp/alerta-visual.json "$ALERTA_WEBHOOK_URL"

      - name: Alertar por e-mail
        if: failure() && steps.alerta.outcome == 'success' && env.SMTP_SERVIDOR != ''
        env:
          SMTP_SERVIDOR: ${{ secrets.SMTP_SERVIDOR }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVIDOR }}
          server_port: ${{ secrets.SMTP_PORTA }}
          username: ${{ secrets.SMTP_USUARIO }}
          password: ${{ secrets.SMTP_SENHA }}
          subject: "[Wise Money] Regressão visual detectada"
          to: ${{ secrets.ALERTA_EMAIL_PARA }}
          from: Wise Money CI <${{ secrets.SMTP_USUARIO }}>
          body: |
            A comparação de screenshots encontrou diferenças (possível retorno da marca d'água).

            Build que falhou: ${{ steps.alerta.outputs.build_url }}
            Commit: ${{ github.sha }}

            ${{ steps.alerta.outputs.detalhes }}

  marca-wise-money:
    name: Verificação de marca (Wise Money)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Conferir título, meta tags e DOM em todas as rotas
        run: bun scripts/verificar-marca.mjs
        env:
          APP_URL: https://chat-wise-money-72.lovable.app

  e2e-atualizacao:
    name: E2E — app instalado atualiza sem reinstalar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Instalar navegador do Playwright
        run: bunx playwright install --with-deps chromium

      - name: Subir o app
        run: |
          bun run dev &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 2; done

      - name: Simular usuário com o app instalado
        run: bun scripts/e2e-atualizacao-pwa.mjs
        env:
          APP_URL: http://localhost:8080
